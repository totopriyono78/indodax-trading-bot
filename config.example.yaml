# ============================================================
#  config.yaml — pengaturan awal bot Indodax
#
#  Sejak versi 2, SEMUA pengaturan trading (pair, stop loss per pair, modal, strategi, mode,
#  API key) disimpan di DATABASE dan diubah lewat halaman web  ->  menu "Pengaturan".
#
#  File ini hanya dipakai untuk:
#   1. lokasi data & alamat dashboard (dibaca setiap start), dan
#   2. nilai AWAL saat database masih kosong (sekali saja, saat `python -m bot init`).
# ============================================================

data_dir: data           # log, database SQLite, state posisi, jurnal transaksi

dashboard:
  host: 127.0.0.1        # 127.0.0.1 = hanya dari VPS (akses lewat SSH tunnel, paling aman)
                         # 0.0.0.0   = bisa dibuka dari internet (pasang HTTPS, lihat README)
  port: 8080

# ---- Nilai awal (hanya dipakai saat database pertama kali dibuat) ----
mode: paper              # paper = simulasi, live = uang sungguhan
pairs: [btcidr, ethidr, dogeidr, pepeidr, solidr]
timeframe: "15"

exits:
  take_profit_pct: 4.0
  stop_loss_pct: 2.5
  trailing_stop_pct: 1.5
  trailing_activation_pct: 2.0
  max_hold_hours: 72

risk:
  idr_per_trade: 100000
  max_open_positions: 3
  max_total_exposure_idr: 300000
  daily_loss_limit_idr: 50000
