<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Indodax — Monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js"></script>
</head>
<body>
<div class="wrap">
  <nav class="topnav" id="topnav"></nav>
  <header>
    <div>
      <h1>Bot Indodax <span id="mode" class="badge">—</span></h1>
      <div class="pill" id="alive"><span class="dot"></span><span>Memuat…</span></div>
    </div>
    <div class="controls" id="controls" hidden>
      <button id="btn-pause">Pause pembelian</button>
      <button id="btn-resume" class="primary">Lanjutkan</button>
      <button id="btn-sellall" class="danger">Jual semua posisi</button>
    </div>
  </header>

  <div id="banners"></div>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid charts">
    <div class="card">
      <h2>PnL terealisasi kumulatif</h2>
      <div class="chart" id="chart-cum"></div>
    </div>
    <div class="card">
      <h2>PnL harian (30 hari)</h2>
      <div class="chart" id="chart-daily"></div>
    </div>
  </div>

  <div class="card section">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
      <h2 style="margin:0">Grafik harga per pair</h2>
      <div class="tabs" id="periods" style="margin:0"></div>
    </div>
    <div class="legend" id="pc-legend"></div>
    <div class="pc-grid" id="pair-charts"><div class="muted">Memuat grafik…</div></div>
  </div>

  <div class="card section">
    <h2>Posisi terbuka</h2>
    <div class="tbl" id="positions"></div>
  </div>

  <div class="card section">
    <h2>Sinyal per pair <span class="muted" style="font-weight:400;font-size:12px" id="tf"></span></h2>
    <div class="tbl" id="signals"></div>
  </div>

  <div class="card section">
    <h2>Transaksi terakhir</h2>
    <div class="tbl" id="trades"></div>
  </div>

  <div class="card section">
    <h2>Pengaturan aktif <a href="/settings" style="font-size:13px;font-weight:600;margin-left:8px">Ubah →</a></h2>
    <div class="settings" id="settings"></div>
  </div>

  <div class="card section">
    <details id="logbox">
      <summary>Log bot (120 baris terakhir)</summary>
      <pre class="log" id="log">Memuat…</pre>
    </details>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const nf0 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rp(x, signed = false) {
  if (x === null || x === undefined || isNaN(x)) return "—";
  const s = (x < 0 ? "−" : (signed && x > 0 ? "+" : "")) + "Rp" + nf0.format(Math.abs(x));
  return s;
}
function px(p) {
  if (p === null || p === undefined || isNaN(p)) return "—";
  if (p >= 100) return nf0.format(p);
  if (p >= 1) return nf2.format(p);
  return new Intl.NumberFormat("id-ID", { maximumSignificantDigits: 6 }).format(p);
}
function pct(x) { return (x === null || x === undefined || isNaN(x)) ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "") + nf2.format(Math.abs(x)) + "%"; }
function cls(x) { return x > 0 ? "pos" : x < 0 ? "neg" : ""; }
function arrow(x) { return x > 0 ? "▲ " : x < 0 ? "▼ " : ""; }
function qty(q) { return new Intl.NumberFormat("id-ID", { maximumFractionDigits: 8 }).format(q); }
function wib(ts) {
  if (!ts) return "—";
  return new Date(ts * 1000).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function dur(sec) {
  if (sec < 3600) return Math.max(1, Math.round(sec / 60)) + " mnt";
  if (sec < 86400) return (sec / 3600).toFixed(1).replace(".", ",") + " jam";
  return (sec / 86400).toFixed(1).replace(".", ",") + " hari";
}
const REASONS = { take_profit: "Take profit", stop_loss: "Stop loss", trailing_stop: "Trailing stop",
  trend_reversal: "Tren berbalik", max_hold_time: "Batas waktu tahan", manual_sellall: "Jual semua (manual)" };

let DATA = null;
let SHOW_ALL = false;

function toast(msg) { App.toast(msg); }

async function load() {
  try {
    DATA = await App.api("GET", "/api/summary");
    render(DATA);
  } catch (e) {
    $("alive").innerHTML = `<span class="dot" style="background:var(--critical)"></span><span>Dashboard tidak bisa memuat data (${esc(e.message)})</span>`;
  }
}

function render(d) {
  const live = d.mode === "live";
  $("mode").textContent = live ? "LIVE — uang sungguhan" : "SIMULASI";
  $("mode").className = "badge" + (live ? " live" : "");
  const colors = { good: "var(--good)", warning: "var(--warning)", critical: "var(--critical)", unknown: "var(--muted)" };
  const icons = { good: "●", warning: "▲", critical: "✕", unknown: "○" };
  $("alive").innerHTML = `<b style="color:${colors[d.alive]}">${icons[d.alive]}</b><span>${esc(d.alive_label)}</span>`;

  // kontrol
  $("controls").hidden = !d.allow_control;
  $("btn-pause").disabled = d.paused;
  $("btn-resume").disabled = !d.paused;

  // banner
  const b = [];
  if (d.paused) b.push(["⏸", "Pembelian baru sedang di-pause. Posisi terbuka tetap dijaga stop loss / take profit."]);
  if (d.sellall_pending) b.push(["⏳", "Perintah jual semua sedang diproses bot."]);
  if (d.halted_today) b.push(["⛔", "Batas rugi harian tercapai — tidak ada pembelian baru sampai besok."]);
  if (d.entries_blocked) b.push(["⚠", "Pembelian dihentikan: " + d.entries_blocked]);
  if (d.storage_warning) b.push(["⚠", d.storage_warning]);
  if (d.alive === "critical") b.push(["✕", "Bot tidak mengirim update. Cek VPS: sudo systemctl status indodax-bot"]);
  $("banners").innerHTML = b.map(([i, t]) => `<div class="banner"><span class="ico">${i}</span><span>${esc(t)}</span></div>`).join("");

  // KPI
  const s = d.settings;
  const k = [
    ["PnL hari ini", rp(d.pnl_today, true), d.pnl_today, `batas rugi harian ${rp(s.daily_loss_limit_idr)}`],
    ["PnL bulan ini", rp(d.pnl_month, true), d.pnl_month, d.mode === "paper" ? `${pct(d.pnl_month / d.paper_start * 100)} dari modal simulasi` : `${pct(d.pnl_month / s.max_total_exposure_idr * 100)} dari eksposur maks.`],
    ["PnL terealisasi total", rp(d.pnl_total, true), d.pnl_total, `${d.trades_count} transaksi selesai`],
    ["Belum terealisasi", rp(d.unrealized, true), d.unrealized, `${d.positions.length} posisi terbuka · sebelum fee jual`],
    ["Win rate", d.win_rate === null ? "—" : nf0.format(d.win_rate) + "%", 0, d.profit_factor === null ? "profit factor —" : `profit factor ${nf2.format(d.profit_factor)}`],
    ["Modal terpakai", rp(d.exposure), 0, `dari maks. ${rp(s.max_total_exposure_idr)}`],
  ];
  if (d.mode === "paper" && d.paper_equity !== null && d.paper_equity !== undefined) {
    k.unshift(["Ekuitas simulasi", rp(d.paper_equity), d.paper_equity - d.paper_start, `${pct((d.paper_equity / d.paper_start - 1) * 100)} dari ${rp(d.paper_start)}`]);
  }
  $("kpis").innerHTML = k.map(([l, v, sign, sub]) =>
    `<div class="card kpi"><div class="label">${l}</div><div class="value ${cls(sign)}">${sign ? `<span class="ar">${arrow(sign).trim()}</span>` : ""}${v}</div><div class="sub">${sub}</div></div>`).join("");

  // posisi
  if (!d.positions.length) {
    $("positions").innerHTML = `<div class="muted">Tidak ada posisi terbuka.</div>`;
  } else {
    $("positions").innerHTML = `<table><thead><tr><th>Pair</th><th class="num">Qty</th><th class="num">Harga beli</th><th class="num">Harga kini (bid)</th><th class="num">Modal</th><th class="num">PnL</th><th class="num">Batas jual (stop)</th><th class="num">Take profit</th><th>Dipegang</th></tr></thead><tbody>` +
      d.positions.map((p) => `<tr>
        <td><b>${esc(p.pair.toUpperCase())}</b>${p.dust ? ' <span class="tag">DUST</span>' : ""}</td>
        <td class="num">${qty(p.qty)}</td>
        <td class="num">${px(p.entry)}</td>
        <td class="num">${px(p.price)}</td>
        <td class="num">${rp(p.cost)}</td>
        <td class="num ${cls(p.pnl)}">${arrow(p.pnl)}${rp(p.pnl, true)} <span class="muted">(${pct(p.pnl_pct)})</span></td>
        <td class="num">${px(p.stop)} <span class="muted">${p.stop_reason === "trailing_stop" ? "trailing" : "SL"}</span></td>
        <td class="num">${px(p.take_profit)}</td>
        <td>${dur(d.now - p.opened_at)}</td></tr>`).join("") + `</tbody></table>`;
  }

  // sinyal
  $("tf").textContent = `· candle ${d.timeframe} menit`;
  const tag = { buy: ["buy", "BELI"], exit: ["exit", "KELUAR"], hold: ["hold", "TUNGGU"] };
  $("signals").innerHTML = `<table><thead><tr><th>Pair</th><th class="num">Harga</th><th class="num">Spread</th><th class="num">Volume 24 jam</th><th>Sinyal</th><th class="num">RSI</th><th class="num">SL / TP</th><th>Keterangan</th><th>Candle</th></tr></thead><tbody>` +
    d.signals.map((g) => {
      const [c, t] = tag[g.action] || ["hold", "—"];
      let note = g.reason || "menunggu data candle";
      if (g.in_position) note = "Sedang dipegang bot · " + note;
      if (g.cooldown_until > d.now) note += ` · jeda sampai ${wib(g.cooldown_until)}`;
      return `<tr><td><b>${esc(g.pair.toUpperCase())}</b></td><td class="num">${px(g.last)}</td>
        <td class="num">${g.spread_pct == null ? "—" : nf2.format(g.spread_pct) + "%"}</td>
        <td class="num">${g.vol_idr == null ? "—" : rp(g.vol_idr)}</td>
        <td><span class="tag ${c}">${t}</span></td><td class="num">${g.rsi == null ? "—" : nf0.format(g.rsi)}</td>
        <td class="num">−${nf2.format(g.stop_loss_pct)}% / ${g.take_profit_pct ? "+" + nf2.format(g.take_profit_pct) + "%" : "—"}${g.custom ? ' <span class="tag">khusus</span>' : ""}</td>
        <td class="wrap-text">${esc(note)}</td><td>${g.candle_time ? wib(g.candle_time) : "—"}</td></tr>`;
    }).join("") + `</tbody></table>`;

  // transaksi
  if (!d.trades.length) {
    $("trades").innerHTML = `<div class="muted">Belum ada transaksi.</div>`;
  } else {
    $("trades").innerHTML = `<table><thead><tr><th>Waktu (WIB)</th><th>Pair</th><th>Sisi</th><th class="num">Qty</th><th class="num">Harga</th><th class="num">Nilai</th><th class="num">Fee</th><th class="num">PnL</th><th>Alasan</th></tr></thead><tbody>` +
      d.trades.slice(0, SHOW_ALL ? 50 : 12).map((t) => {
        const pnl = t.pnl_idr === "" ? null : Number(t.pnl_idr);
        return `<tr><td>${esc(t.waktu_wib)}</td><td>${esc(t.pair.toUpperCase())}</td>
        <td><span class="tag ${t.sisi === "BUY" ? "buy" : "exit"}">${t.sisi === "BUY" ? "BELI" : "JUAL"}</span></td>
        <td class="num">${qty(Number(t.qty))}</td><td class="num">${px(Number(t.harga))}</td>
        <td class="num">${rp(Number(t.idr))}</td><td class="num">${rp(Number(t.fee_idr))}</td>
        <td class="num ${cls(pnl)}">${pnl === null ? "" : arrow(pnl) + rp(pnl, true) + ` <span class="muted">(${pct(Number(t.pnl_pct))})</span>`}</td>
        <td class="wrap-text">${esc(REASONS[t.alasan] || t.alasan)}</td></tr>`;
      }).join("") + `</tbody></table>` +
      (d.trades.length > 12 ? `<button id="more" style="margin-top:10px">${SHOW_ALL ? "Tampilkan lebih sedikit" : "Tampilkan " + d.trades.length + " transaksi terakhir"}</button>` : "");
    const more = $("more"); if (more) more.onclick = () => { SHOW_ALL = !SHOW_ALL; render(DATA); };
  }

  // pengaturan
  const set = [
    ["Pair", s.pairs.map((p) => p.toUpperCase()).join(", ")],
    ["Modal per transaksi", rp(s.idr_per_trade)],
    ["Posisi maksimum", s.max_open_positions],
    ["Eksposur maksimum", rp(s.max_total_exposure_idr)],
    ["Batas rugi harian", rp(s.daily_loss_limit_idr)],
    ["Take profit", s.take_profit_pct ? `+${nf2.format(s.take_profit_pct)}%` : "nonaktif"],
    ["Stop loss", `−${nf2.format(s.stop_loss_pct)}%`],
    ["Trailing stop", s.trailing_stop_pct ? `${nf2.format(s.trailing_stop_pct)}% dari puncak (aktif setelah +${nf2.format(s.trailing_activation_pct)}%)` : "nonaktif"],
    ["Batas waktu tahan", s.max_hold_hours ? `${s.max_hold_hours} jam` : "tanpa batas"],
  ];
  $("settings").innerHTML = set.map(([a, v]) => `<div><span>${a}:</span> ${esc(v)}</div>`).join("");
  $("footer").textContent = `v${d.version} · diperbarui otomatis tiap 15 detik · terakhir ${wib(d.now)} WIB`;

  drawCumulative(d.curve);
  drawDaily(d.daily);
}

/* ---------- grafik (SVG, tanpa library) ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(v);
  return out;
}
function shortRp(v) {
  const a = Math.abs(v), sign = v < 0 ? "−" : "";
  if (a >= 1e9) return sign + nf2.format(a / 1e9).replace(/,00$/, "") + " M";
  if (a >= 1e6) return sign + nf2.format(a / 1e6).replace(/,00$/, "") + " jt";
  if (a >= 1e3) return sign + nf0.format(a / 1e3) + " rb";
  return sign + nf0.format(a);
}
function frame(el, ticks, yOf, W, H, M) {
  let g = "";
  for (const t of ticks) {
    const y = yOf(t);
    g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${M.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${shortRp(t)}</text>`;
  }
  const y0 = yOf(0);
  if (y0 >= M.t && y0 <= H - M.b) g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y0}" y2="${y0}" stroke="var(--axis)" stroke-width="1"/>`;
  return g;
}
function tipAt(el, html, x, y) {
  let tip = el.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; el.appendChild(tip); }
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, max = el.clientWidth - w;
  tip.style.left = Math.max(0, Math.min(max, x - w / 2)) + "px";
  tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + "px";
}
function hideTip(el) { const t = el.querySelector(".tip"); if (t) t.style.display = "none"; }

function drawCumulative(curve) {
  const el = $("chart-cum");
  if (!curve.length) { el.innerHTML = `<div class="empty">Grafik muncul setelah ada penjualan pertama.</div>`; return; }
  const W = el.clientWidth || 400, H = el.clientHeight || 220, M = { l: 52, r: 12, t: 12, b: 24 };
  const vals = [0, ...curve.map((c) => c.cum)];
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const n = curve.length;
  const xOf = (i) => M.l + (n === 0 ? 0 : (i / n) * (W - M.l - M.r));
  const yOf = (v) => M.t + (1 - (v - lo) / (hi - lo)) * (H - M.t - M.b);
  let path = `M${xOf(0)},${yOf(0)}`;
  curve.forEach((c, i) => (path += ` L${xOf(i + 1)},${yOf(c.cum)}`));
  const last = curve[n - 1];
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="PnL kumulatif ${rp(last.cum, true)} setelah ${n} penjualan">`;
  svg += frame(el, ticks, yOf, W, H, M);
  svg += `<text x="${M.l}" y="${H - 6}" font-size="11" fill="var(--muted)">penjualan ke-1</text>`;
  svg += `<text x="${W - M.r}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">ke-${n}</text>`;
  svg += `<path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  svg += `<circle cx="${xOf(n)}" cy="${yOf(last.cum)}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`;
  svg += `<line id="cx" y1="${M.t}" y2="${H - M.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  svg += `<circle id="cp" r="5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  svg += `<rect x="${M.l}" y="0" width="${W - M.l - M.r}" height="${H}" fill="transparent" id="hit"/></svg>`;
  el.innerHTML = svg;
  const hit = el.querySelector("#hit"), cx = el.querySelector("#cx"), cp = el.querySelector("#cp");
  const move = (ev) => {
    const r = el.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(1, Math.min(n, Math.round(((x - M.l) / (W - M.l - M.r)) * n)));
    const c = curve[i - 1], X = xOf(i), Y = yOf(c.cum);
    cx.setAttribute("x1", X); cx.setAttribute("x2", X); cx.setAttribute("visibility", "visible");
    cp.setAttribute("cx", X); cp.setAttribute("cy", Y); cp.setAttribute("visibility", "visible");
    tipAt(el, `${esc(c.t)}<br>${esc(c.pair.toUpperCase())} · ${esc(REASONS[c.reason] || c.reason)}<br>transaksi: <b class="${cls(c.pnl)}">${rp(c.pnl, true)}</b><br>kumulatif: <b>${rp(c.cum, true)}</b>`, X, Y);
  };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", () => { cx.setAttribute("visibility", "hidden"); cp.setAttribute("visibility", "hidden"); hideTip(el); });
}

function drawDaily(days) {
  const el = $("chart-daily");
  if (!days.length) { el.innerHTML = `<div class="empty">Belum ada PnL harian.</div>`; return; }
  const W = el.clientWidth || 400, H = el.clientHeight || 220, M = { l: 52, r: 12, t: 12, b: 24 };
  const ticks = niceTicks(Math.min(0, ...days.map((d) => d.pnl)), Math.max(0, ...days.map((d) => d.pnl)));
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const yOf = (v) => M.t + (1 - (v - lo) / (hi - lo)) * (H - M.t - M.b);
  const slot = (W - M.l - M.r) / days.length, bw = Math.max(3, Math.min(28, slot - 2));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="PnL harian ${days.length} hari">`;
  svg += frame(el, ticks, yOf, W, H, M);
  const y0 = yOf(0);
  days.forEach((d, i) => {
    const x = M.l + i * slot + (slot - bw) / 2, y = yOf(d.pnl), h = Math.max(1, Math.abs(y - y0));
    const top = d.pnl >= 0 ? y : y0, r = Math.min(4, bw / 2, h);
    const col = d.pnl >= 0 ? "var(--series-1)" : "var(--neg)";
    // ujung data membulat 4px, pangkal rata di garis nol
    const path = d.pnl >= 0
      ? `M${x},${y0} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${y0} Z`
      : `M${x},${y0} V${y0 + h - r} Q${x},${y0 + h} ${x + r},${y0 + h} H${x + bw - r} Q${x + bw},${y0 + h} ${x + bw},${y0 + h - r} V${y0} Z`;
    svg += `<path d="${path}" fill="${col}"/>`;
  });
  svg += `<text x="${M.l}" y="${H - 6}" font-size="11" fill="var(--muted)">${esc(days[0].d.slice(5))}</text>`;
  svg += `<text x="${W - M.r}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(days[days.length - 1].d.slice(5))}</text>`;
  svg += `<rect x="${M.l}" y="0" width="${W - M.l - M.r}" height="${H}" fill="transparent" id="hitd"/></svg>`;
  el.innerHTML = svg;
  const hit = el.querySelector("#hitd");
  const move = (ev) => {
    const r = el.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(days.length - 1, Math.floor((x - M.l) / slot)));
    const d = days[i];
    tipAt(el, `${esc(d.d)}<br>PnL: <b class="${cls(d.pnl)}">${arrow(d.pnl)}${rp(d.pnl, true)}</b>`, M.l + i * slot + slot / 2, yOf(Math.max(0, d.pnl)));
  };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", () => hideTip(el));
}

/* ---------- grafik harga per pair ---------- */
const PERIODS = [["1d", "1 hari"], ["7d", "7 hari"], ["30d", "30 hari"], ["90d", "90 hari"]];
let PERIOD = "1d";
try { PERIOD = localStorage.getItem("pc-period") || "1d"; } catch (e) {}
const PC = {};           // pair -> data grafik
let PC_PAIRS = [];
let PC_LOADED_AT = 0;

function shortPx(v) {
  const a = Math.abs(v);
  const f3 = (x) => new Intl.NumberFormat("id-ID", { maximumFractionDigits: 3 }).format(x);
  if (a >= 1e9) return f3(v / 1e9) + " M";
  if (a >= 1e6) return nf2.format(v / 1e6).replace(/,00$/, "") + " jt";
  if (a >= 1e4) return nf0.format(v);
  return px(v);
}
function tfmt(ts, period) {
  const d = new Date(ts * 1000);
  const o = period === "1d" ? { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" } : { day: "2-digit", month: "short" };
  return d.toLocaleString("id-ID", { timeZone: "Asia/Jakarta", ...o });
}
function tfull(ts) {
  return new Date(ts * 1000).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}

function renderPeriods() {
  $("periods").innerHTML = PERIODS.map(([k, l]) => `<button class="${k === PERIOD ? "active" : ""}" data-p="${k}">${l}</button>`).join("");
  $("periods").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    PERIOD = b.dataset.p; try { localStorage.setItem("pc-period", PERIOD); } catch (e) {}
    renderPeriods(); loadPairCharts(true);
  }));
  $("pc-legend").innerHTML = `
    <span><svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--series-1)" stroke-width="2"/></svg>harga</span>
    <span><svg width="12" height="12"><path d="M6 1 L11 10 L1 10 Z" fill="var(--buy)" stroke="var(--surface)" stroke-width="1"/></svg>beli oleh bot</span>
    <span><svg width="12" height="12"><path d="M6 11 L11 2 L1 2 Z" fill="var(--sell)" stroke="var(--surface)" stroke-width="1"/></svg>jual oleh bot</span>
    <span><svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--text-2)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>harga beli posisi</span>
    <span><svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--critical)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>stop loss</span>
    <span><svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>take profit</span>
    <span><svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--text)" stroke-width="1"/></svg>harga terkini</span>`;
}

async function loadPairCharts(force) {
  if (!DATA) return;
  const pairs = [...new Set([...DATA.positions.map((p) => p.pair), ...DATA.signals.map((g) => g.pair)])];
  const changed = pairs.join() !== PC_PAIRS.join();
  if (!force && !changed && Date.now() - PC_LOADED_AT < 60000) { drawAllPairCharts(); return; }
  PC_PAIRS = pairs; PC_LOADED_AT = Date.now();
  const grid = $("pair-charts");
  if (!pairs.length) { grid.innerHTML = `<div class="muted">Belum ada pair aktif.</div>`; return; }
  grid.innerHTML = pairs.map((p) => `<div class="pc-card" id="pc-${esc(p)}"><div class="pc-head"><b>${esc(p.toUpperCase())}</b><span class="muted">memuat…</span></div><div class="pc-chart"></div></div>`).join("");
  await Promise.all(pairs.map(async (p) => {
    try { PC[p] = await App.api("GET", `/api/chart?pair=${encodeURIComponent(p)}&period=${PERIOD}`); }
    catch (e) { PC[p] = { error: e.message }; }
  }));
  drawAllPairCharts();
}

function drawAllPairCharts() {
  for (const p of PC_PAIRS) {
    const el = document.getElementById("pc-" + p);
    if (el && PC[p]) drawPairChart(el, PC[p]);
  }
}

function drawPairChart(card, d) {
  const head = card.querySelector(".pc-head"), el = card.querySelector(".pc-chart");
  if (d.error) { head.innerHTML = `<b>${esc(card.id.slice(3).toUpperCase())}</b><span class="neg">${esc(d.error)}</span>`; el.innerHTML = ""; return; }
  const c = d.candles || [];
  // harga terkini: pakai harga dari bot jika ada (lebih baru dari candle)
  const now = d.last || (c.length ? c[c.length - 1][4] : null);
  const first = c.length ? c[0][1] : null;
  const chg = first && now ? (now / first - 1) * 100 : null;
  const pos = d.position;
  let posTxt = "";
  if (pos && now) {
    const pnl = (now / pos.entry - 1) * 100;
    posTxt = `<span class="tag ${pnl >= 0 ? "buy" : "exit"}">posisi ${pnl >= 0 ? "+" : "−"}${nf2.format(Math.abs(pnl))}%</span>`;
  }
  head.innerHTML = `<b>${esc(d.pair.toUpperCase())}</b>
    <span class="pc-price">${px(now)}</span>
    <span class="${cls(chg)}">${chg === null ? "" : arrow(chg) + pct(chg)}</span>${posTxt}`;
  if (c.length < 2) { el.innerHTML = `<div class="empty">Data harga belum tersedia.</div>`; return; }

  const W = el.clientWidth || 360, H = el.clientHeight || 210, M = { l: 8, r: 78, t: 10, b: 20 };
  const vals = [];
  c.forEach((k) => vals.push(k[2], k[3]));
  const lines = [];
  if (pos) {
    lines.push({ v: pos.entry, col: "var(--text-2)", dash: "4 3", label: "beli " + shortPx(pos.entry), w: 1.5 });
    if (pos.stop) lines.push({ v: pos.stop, col: "var(--critical)", dash: "4 3", label: (pos.stop_reason === "trailing_stop" ? "trail " : "SL ") + shortPx(pos.stop), w: 1.5 });
    if (pos.take_profit) lines.push({ v: pos.take_profit, col: "var(--good)", dash: "4 3", label: "TP " + shortPx(pos.take_profit), w: 1.5 });
  }
  if (now) lines.push({ v: now, col: "var(--text)", dash: "", label: shortPx(now), w: 1, current: true });
  lines.forEach((l) => vals.push(l.v));
  (d.trades || []).forEach((t) => vals.push(t.price));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || hi * 0.01;
  lo -= pad; hi += pad;
  const t0 = c[0][0], t1 = Math.max(c[c.length - 1][0], ...(d.trades || []).map((t) => t.t));
  const xOf = (t) => M.l + ((t - t0) / Math.max(1, t1 - t0)) * (W - M.l - M.r);
  const yOf = (v) => M.t + (1 - (v - lo) / (hi - lo)) * (H - M.t - M.b);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik harga ${esc(d.pair)} ${PERIOD}">`;
  // grid & sumbu harga (kanan)
  const ticks = niceTicks(lo, hi, 4).filter((v) => v >= lo && v <= hi);
  for (const v of ticks) {
    const y = yOf(v);
    svg += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
  }
  svg += `<text x="${M.l}" y="${H - 5}" font-size="10.5" fill="var(--muted)">${esc(tfmt(t0, PERIOD))}</text>`;
  svg += `<text x="${W - M.r}" y="${H - 5}" font-size="10.5" fill="var(--muted)" text-anchor="end">${esc(tfmt(c[c.length - 1][0], PERIOD))}</text>`;
  // garis harga (close)
  let path = "";
  c.forEach((k, i) => (path += (i ? " L" : "M") + xOf(k[0]).toFixed(1) + "," + yOf(k[4]).toFixed(1)));
  svg += `<path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  // garis referensi: harga beli, SL, TP, harga terkini
  for (const l of lines) {
    const y = yOf(l.v);
    svg += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="${l.col}" stroke-width="${l.w}" ${l.dash ? `stroke-dasharray="${l.dash}"` : ""} opacity="${l.current ? 0.55 : 0.9}"/>`;
  }
  // label di margin kanan, digeser agar tidak bertumpuk
  const labs = lines.map((l) => ({ ...l, y: yOf(l.v) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labs.length; i++) {
    const gap = labs[i].current || labs[i - 1].current ? 17 : 13;
    if (labs[i].y - labs[i - 1].y < gap) labs[i].y = labs[i - 1].y + gap;
  }
  // jika label terdorong keluar bawah, geser semua ke atas
  const over = labs.length ? labs[labs.length - 1].y - (H - M.b) : 0;
  if (over > 0) labs.forEach((l) => (l.y -= over));
  for (const l of labs) {
    const y = l.y;
    if (l.current) {
      svg += `<rect x="${W - M.r + 3}" y="${y - 8}" width="${M.r - 4}" height="16" rx="4" fill="var(--text)"/>`;
      svg += `<text x="${W - M.r + 7}" y="${y + 4}" font-size="10.5" font-weight="700" fill="var(--surface)">${esc(l.label)}</text>`;
    } else {
      svg += `<text x="${W - M.r + 6}" y="${y + 4}" font-size="10.5" fill="var(--text-2)">${esc(l.label)}</text>`;
    }
  }
  // penanda transaksi bot
  (d.trades || []).forEach((t, i) => {
    const x = xOf(t.t), y = yOf(t.price);
    const shape = t.side === "BUY"
      ? `M${x} ${y + 3} l6 11 h-12 Z`         // ▲ di bawah harga beli
      : `M${x} ${y - 3} l6 -11 h-12 Z`;       // ▼ di atas harga jual
    svg += `<path d="${shape}" fill="${t.side === "BUY" ? "var(--buy)" : "var(--sell)"}" stroke="var(--surface)" stroke-width="1.5"/>`;
  });
  svg += `<line class="cx" y1="${M.t}" y2="${H - M.b}" stroke="var(--axis)" visibility="hidden"/>`;
  svg += `<circle class="cp" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  svg += `<rect class="hit" x="${M.l}" y="0" width="${W - M.l - M.r}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = svg;

  const hit = el.querySelector(".hit"), cx = el.querySelector(".cx"), cp = el.querySelector(".cp");
  const move = (ev) => {
    const r = el.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    // transaksi terdekat (radius 10px) diutamakan
    let best = null, bd = 11;
    for (const t of d.trades || []) { const dx = Math.abs(xOf(t.t) - x); if (dx < bd) { bd = dx; best = t; } }
    if (best) {
      const X = xOf(best.t), Y = yOf(best.price);
      cx.setAttribute("x1", X); cx.setAttribute("x2", X); cx.setAttribute("visibility", "visible");
      cp.setAttribute("visibility", "hidden");
      const pl = best.pnl === null ? "" : `<br>PnL <b class="${cls(best.pnl)}">${rp(best.pnl, true)}</b> (${pct(best.pnl_pct)})`;
      tipAt(el, `<b>${best.side === "BUY" ? "▲ BELI" : "▼ JUAL"}</b> · ${esc(tfull(best.t))}<br>harga <b>${px(best.price)}</b> · ${rp(best.idr)}${pl}${best.side === "SELL" ? "<br>" + esc(REASONS[best.reason] || best.reason) : ""}`, X, Y);
      return;
    }
    const tx = t0 + ((x - M.l) / (W - M.l - M.r)) * (t1 - t0);
    let i = 0, bi = Infinity;
    c.forEach((k, j) => { const dd = Math.abs(k[0] - tx); if (dd < bi) { bi = dd; i = j; } });
    const k = c[i], X = xOf(k[0]), Y = yOf(k[4]);
    cx.setAttribute("x1", X); cx.setAttribute("x2", X); cx.setAttribute("visibility", "visible");
    cp.setAttribute("cx", X); cp.setAttribute("cy", Y); cp.setAttribute("visibility", "visible");
    tipAt(el, `${esc(tfull(k[0]))}<br>tutup <b>${px(k[4])}</b><br><span class="muted">tinggi ${px(k[2])} · rendah ${px(k[3])}</span>`, X, Y);
  };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", () => { cx.setAttribute("visibility", "hidden"); cp.setAttribute("visibility", "hidden"); hideTip(el); });
}

/* ---------- kontrol ---------- */
async function act(action, confirmText) {
  if (confirmText && !window.confirm(confirmText)) return;
  try {
    const j = await App.api("POST", "/api/control/" + action, {});
    toast(j.message || "Selesai");
  } catch (e) { toast("Gagal: " + e.message); }
  load();
}
$("btn-pause").onclick = () => act("pause");
$("btn-resume").onclick = () => act("resume");
$("btn-sellall").onclick = () => act("sellall", "Jual SEMUA posisi yang dipegang bot sekarang dengan harga pasar?\nPembelian baru juga akan di-pause.");

async function loadLog() {
  try {
    const j = await App.api("GET", "/api/log");
    const pre = $("log");
    pre.textContent = j.lines.length ? j.lines.join("\n") : "Log masih kosong.";
    pre.scrollTop = pre.scrollHeight;
  } catch (e) { $("log").textContent = "Gagal memuat log: " + e.message; }
}
$("logbox").addEventListener("toggle", () => { if ($("logbox").open) loadLog(); });

App.nav("dash").catch(() => {});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (DATA) render(DATA); drawAllPairCharts(); }, 150); });
renderPeriods();
load().then(() => loadPairCharts(true));
setInterval(() => { load().then(() => loadPairCharts(false)); if ($("logbox").open) loadLog(); }, 15000);
</script>
